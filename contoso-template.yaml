AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Contoso AWS Agent Demo - regional resources in Ohio only
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: specs/001-personal-authenticated-chat/plan.md
        has: regional scope, ephemeral conversation, public URL cost boundary
Parameters:
  TenantId:
    Type: String
    AllowedPattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
  ApiAudience:
    Type: String
    AllowedPattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
  AllowedUserOid:
    Type: String
    AllowedPattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
  RequiredScope:
    Type: String
    Default: access_as_user
    AllowedPattern: "[A-Za-z0-9_.-]+"
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    AllowedValues: [amazon.nova-lite-v1:0]
  MaxMessages:
    Type: Number
    Default: 10
    MinValue: 1
  MaxOutputTokens:
    Type: Number
    Default: 400
    MinValue: 1
  CONTOSOEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
  CONTOSOGatewayURL:
    Type: String
    Default: ""
    AllowedPattern: "(|https://[a-z0-9][a-z0-9.-]*\\.azurewebsites\\.net(/|/api/invoke|/api/a2a)?)"
  CONTOSOEntraTenantId:
    Type: String
    Default: ""
    AllowedPattern: "(|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"
  CONTOSOGatewayApiClientId:
    Type: String
    Default: ""
    AllowedPattern: "(|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"
  CONTOSORequesterClientId:
    Type: String
    Default: ""
    AllowedPattern: "(|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})"
  CONTOSORequesterSecretName:
    Type: String
    Default: ""
    AllowedPattern: "(|contoso-[a-z0-9-]+/requester)"
    MaxLength: 512
    Description: Same-project Secrets Manager name containing the client_secret JSON key, never the credential value.
Conditions:
  UseCONTOSO:
    Fn::Equals: [{Ref: CONTOSOEnabled}, "true"]
Rules:
  CONTOSOProtectedCredential:
    RuleCondition:
      Fn::Equals: [{Ref: CONTOSOEnabled}, "true"]
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals: [{Ref: CONTOSORequesterSecretName}, ""]
        AssertDescription: Enabled Contoso integration requires an existing protected requester secret.
  ProjectRegion:
    Assertions:
      - Assert:
          Fn::Equals:
            - Ref: AWS::Region
            - us-east-2
        AssertDescription: All regional project resources must be created in us-east-2.
Resources:
  ChatLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: short-lived metadata-only diagnostics; no retained conversation
        must: [Keep name coupled to function, Never log tokens or message content]
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${AWS::StackName}-chat"
      RetentionInDays: 3
  ChatRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: service execution only; no human access or broad managed policy
        must: [Only approved regional model and precreated log streams]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ChatModelAndLogStreams
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/${BedrockModelId}"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  Fn::GetAtt: [ChatLogGroup, Arn]
  ChatFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
      BuildArchitecture: arm64
      com.aws.cloudformation.Context:
        why: stateless on-demand POC; handler verifies Entra before inference
        must:
          - No tracing or conversation persistence
          - Public URL requires explicit cost acceptance
          - Resolve requester credential only from the same-project protected secret
          - Never log resolved environment settings
    DependsOn: ChatLogGroup
    Properties:
      FunctionName:
        Fn::Sub: "${AWS::StackName}-chat"
      CodeUri: contoso_backend/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout:
        Fn::If: [UseCONTOSO, 90, 30]
      ReservedConcurrentExecutions: 2
      Role:
        Fn::GetAtt: [ChatRole, Arn]
      Environment:
        Variables:
          TENANT_ID:
            Ref: TenantId
          API_AUDIENCE:
            Ref: ApiAudience
          ALLOWED_USER_OID:
            Ref: AllowedUserOid
          REQUIRED_SCOPE:
            Ref: RequiredScope
          BEDROCK_MODEL_ID:
            Ref: BedrockModelId
          MAX_MESSAGES:
            Ref: MaxMessages
          MAX_OUTPUT_TOKENS:
            Ref: MaxOutputTokens
          CONTOSO_ENABLED:
            Ref: CONTOSOEnabled
          CONTOSO_GATEWAY_URL:
            Ref: CONTOSOGatewayURL
          CONTOSO_ENTRA_TENANT_ID:
            Ref: CONTOSOEntraTenantId
          CONTOSO_GATEWAY_API_CLIENT_ID:
            Ref: CONTOSOGatewayApiClientId
          CONTOSO_REQUESTER_CLIENT_ID:
            Ref: CONTOSORequesterClientId
          CONTOSO_REQUESTER_CLIENT_SECRET:
            Fn::If:
              - UseCONTOSO
              - Fn::Sub: "{{resolve:secretsmanager:${CONTOSORequesterSecretName}:SecretString:client_secret}}"
              - ""
          LOG_LEVEL: INFO
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins: ["http://localhost:8000"]
          AllowMethods: [POST]
          AllowHeaders: [Authorization, Content-Type]
          AllowCredentials: false
Outputs:
  FunctionUrl:
    Description: Public Function URL - Entra access token required by the handler
    Value:
      Fn::GetAtt: [ChatFunctionUrl, FunctionUrl]
  FunctionName:
    Value:
      Ref: ChatFunction
  ExecutionRoleArn:
    Value:
      Fn::GetAtt: [ChatRole, Arn]
  LogGroupName:
    Value:
      Ref: ChatLogGroup
