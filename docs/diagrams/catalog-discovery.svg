<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Contoso Motors API Center discovery versus APIM invocation</title><desc id="desc">On each admitted request the Router uses its identity to read API Center. API Center returns capability, APIM endpoint, version and source metadata. The Router validates the metadata and invokes the matching approved APIM A2A route with a Gateway API application token. The catalog does not proxy the business request or create permissions.</desc><defs><marker id="arrow-0078d4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078d4"/></marker><marker id="arrow-008575" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#008575"/></marker><marker id="arrow-7b8fa3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8fa3"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="58" data-max-width="1120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="650" fill="#000000"><tspan x="40" dy="0">Discover in API Center. Invoke through APIM.</tspan></text>
<text x="40" y="98" data-max-width="1120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="40" dy="0">The Router reads the catalog for every admitted request, then calls the matching approved route.</tspan></text>
<rect x="50" y="186" width="320" height="180" rx="0" fill="#ffffff" stroke="#b5cde0" stroke-width="2"/>
<image x="68" y="205" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="124" y="225" data-max-width="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000"><tspan x="124" dy="0">Foundry</tspan><tspan x="124" dy="31.9">Hosted Router</tspan></text>
<text x="70" y="293" data-max-width="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="70" dy="0">Read and validate metadata</tspan><tspan x="70" dy="27.55">Select a registered capability</tspan></text>
<rect x="820" y="186" width="330" height="180" rx="0" fill="#ffffff" stroke="#b5cde0" stroke-width="2"/>
<image x="838" y="205" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="894" y="225" data-max-width="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000"><tspan x="894" dy="0">API Center</tspan></text>
<text x="840" y="293" data-max-width="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="840" dy="0">Capability and APIM endpoint</tspan><tspan x="840" dy="27.55">Version and source metadata</tspan></text>
<path d="M 370 242 L 820 242" fill="none" stroke="#008575" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-008575)"/>
<text x="466" y="223" data-max-width="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#000000"><tspan x="466" dy="0">1  Read catalog with Router identity</tspan></text>
<path d="M 820 330 L 370 330" fill="none" stroke="#008575" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-008575)"/>
<text x="420" y="304" data-max-width="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#000000"><tspan x="420" dy="0">2  Return route and source metadata</tspan></text>
<rect x="820" y="436" width="330" height="150" rx="0" fill="#ffffff" stroke="#b5cde0" stroke-width="2"/>
<image x="838" y="455" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="894" y="475" data-max-width="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000"><tspan x="894" dy="0">APIM</tspan></text>
<text x="840" y="543" data-max-width="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="840" dy="0">Authenticate and apply policy</tspan><tspan x="840" dy="27.55">Call the selected specialist</tspan></text>
<path d="M 210 366 L 210 510 L 820 510" fill="none" stroke="#0078d4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078d4)"/>
<text x="390" y="469" data-max-width="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#000000"><tspan x="390" dy="0">3  Invoke the approved A2A route</tspan><tspan x="390" dy="27.55">Use a Gateway API application token</tspan></text>
<text x="40" y="637" data-max-width="1120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="40" dy="0">API Center returns metadata. It does not proxy business requests, create APIs or grant permissions.</tspan></text></svg>