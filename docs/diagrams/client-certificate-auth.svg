<text x="924" y="507" data-max-width="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000"><tspan x="924" dy="0">APIM</tspan></text>
<text x="870" y="575" data-max-width="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="870" dy="0">Validates the token and role</tspan><tspan x="870" dy="27.55">CONTOSO.Invoke</tspan></text>
<path d="M 350 520 L 460 520" fill="none" stroke="#0078d4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078d4)"/>
<text x="361" y="488" data-max-width="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000"><tspan x="361" dy="0">Signed</tspan><tspan x="361" dy="23.2">assertion</tspan></text>
<path d="M 460 610 L 350 610" fill="none" stroke="#008575" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-008575)"/>
<text x="361" y="636" data-max-width="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#000000"><tspan x="361" dy="0">Access</tspan><tspan x="361" dy="23.2">token</tspan></text>
<path d="M 210 640 L 210 718 L 990 718 L 990 640" fill="none" stroke="#0078d4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078d4)"/>
<text x="465" y="696" data-max-width="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#000000"><tspan x="465" dy="0">Bearer token in the HTTPS request</tspan></text>
<text x="40" y="804" data-max-width="1120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="40" dy="0">The certificate proves identity to Entra. APIM receives a token, not a client certificate. No mTLS.</tspan></text></svg>