<text x="480" y="575" data-max-width="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="480" dy="0">Checks the registered cert</tspan><tspan x="480" dy="27.55">Issues an application token</tspan></text>
<rect x="850" y="468" width="280" height="172" rx="0" fill="#ffffff" stroke="#b5cde0" stroke-width="2"/>
