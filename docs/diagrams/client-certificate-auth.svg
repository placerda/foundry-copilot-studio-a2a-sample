<text x="90" y="575" data-max-width="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="90" dy="0">Private key in Windows</tspan><tspan x="90" dy="27.55">Credential Manager</tspan></text>
<rect x="460" y="468" width="280" height="172" rx="0" fill="#ffffff" stroke="#b5cde0" stroke-width="2"/>
<image x="478" y="487" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
