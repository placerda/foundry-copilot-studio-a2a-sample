<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Contoso Motors client certificate authentication</title><desc id="desc">User sign-in and application authentication are separate. The browser sends a delegated local API token to Python. The Python requester signs a client assertion with its protected private key. Entra validates the registered certificate and returns a Gateway API application token. Python sends that Bearer token to APIM. The certificate is not used for mutual TLS with APIM.</desc><defs><marker id="arrow-0078d4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0078d4"/></marker><marker id="arrow-008575" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#008575"/></marker><marker id="arrow-7b8fa3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8fa3"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="58" data-max-width="1120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="650" fill="#000000"><tspan x="40" dy="0">Two identities, two different tokens</tspan></text>
<text x="40" y="98" data-max-width="1120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="40" dy="0">The user signs in. The Python requester authenticates with its own certificate.</tspan></text>
<rect x="40" y="132" width="1120" height="232" rx="0" fill="none" stroke="#9cbad3" stroke-width="2"/>
<rect x="40" y="132" width="1120" height="38" rx="0" fill="#e5f0f8" stroke="#9cbad3" stroke-width="2"/>
<text x="56" y="157" data-max-width="1088" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#000000"><tspan x="56" dy="0">USER IDENTITY  /  Browser to local Python API</tspan></text>
<rect x="70" y="192" width="340" height="148" rx="0" fill="#ffffff" stroke="#b5cde0" stroke-width="2"/>
<image x="88" y="211" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="144" y="231" data-max-width="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000"><tspan x="144" dy="0">Signed-in user</tspan></text>
<text x="90" y="299" data-max-width="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="90" dy="0">Microsoft sign-in in the browser</tspan><tspan x="90" dy="27.55">Delegated token for the local API</tspan></text>
<rect x="670" y="192" width="460" height="148" rx="0" fill="#ffffff" stroke="#b5cde0" stroke-width="2"/>
<image x="688" y="211" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="744" y="231" data-max-width="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#000000"><tspan x="744" dy="0">Local Python API</tspan></text>
<text x="690" y="299" data-max-width="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="690" dy="0">Validate the user token and approved user</tspan><tspan x="690" dy="27.55">Do not forward this token to APIM</tspan></text>
<path d="M 410 266 L 670 266" fill="none" stroke="#0078d4" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-0078d4)"/>
<text x="450" y="223" data-max-width="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#000000"><tspan x="450" dy="0">User token</tspan><tspan x="450" dy="26.099999999999998">Local API audience</tspan></text>
<rect x="40" y="394" width="1120" height="364" rx="0" fill="none" stroke="#9cbad3" stroke-width="2"/>
<rect x="40" y="394" width="1120" height="38" rx="0" fill="#e5f0f8" stroke="#9cbad3" stroke-width="2"/>
<text x="56" y="419" data-max-width="1088" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#000000"><tspan x="56" dy="0">APPLICATION IDENTITY  /  OAuth 2.0 Client Credentials with a certificate</tspan></text>
