openapi: 3.1.0
info:
  title: Personal authenticated chat
  version: 1.0.0
  description: >
    Lambda Function URL BUFFERED/NONE. Entra access-token validation and
    owner authorization occur in the handler before graph or inference.
    A public URL can incur Lambda costs even for rejected requests.
paths:
  /:
    post:
      operationId: sendChatMessage
      summary: Send recent context ending with the current user message
      security:
        - entraAccessToken: []
      requestBody:
        required: true
        description: >
          Complete UTF-8 JSON body at most 32768 bytes, after transport
          base64 decoding. No compression. Only user/assistant roles;
          alternate, start and end with user, hence odd list length.
          Contents contain at most 4000 Unicode code points each;
          isolated surrogates and whitespace-only content are invalid.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
            example:
              messages:
                - role: user
                  content: Explain LangGraph in one sentence.
      responses:
        '200':
          description: >
            All generated text in one buffered response; initially up to
            400 model output tokens. Nonblank text stopped by the generation
            limit is successful with output_limited true and must be displayed
            with a limit notice, never automatically continued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
              examples:
                normal:
                  value:
                    answer: LangGraph organizes conversational workflows as a graph.
                    request_id: example-normal-request
                    output_limited: false
                limited:
                  value:
                    answer: This explanation reached the generation limit before finishing.
                    request_id: example-limited-request
                    output_limited: true
        '400':
          description: Invalid JSON, encoding, media type, shape, message sequence or limits; no inference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '401':
          description: Missing or invalid bearer access token, including signature, algorithm, issuer, audience, tenant or time
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '403':
          description: Authentic token without required delegated scope or allowed owner oid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '429':
          description: >
            Bedrock throttling returns a handler error. Lambda concurrency
            throttling before handler execution may instead return a
            platform-native body without request_id.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChatError'
                  - type: object
                    additionalProperties: true
            text/plain:
              schema:
                type: string
        '500':
          description: Sanitized internal error; platform failures may have a different body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
        '502':
          description: Required identity keys unavailable, inference timeout/unavailability or invalid upstream response; no fail-open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatError'
      x-body-max-bytes: 32768
      x-output-max-tokens-default: 400
    options:
      operationId: preflightChat
      summary: Browser CORS preflight handled by the Function URL
      security: []
      responses:
        '200':
          description: Platform CORS preflight; no JWT, graph or inference
    x-unsupported-methods:
      status: 405
      allow: POST, OPTIONS
      description: Handler returns sanitized ChatError for other methods; no inference.
  x-path-policy:
    description: Non-root paths return a sanitized 400 unsupported_path error; no inference.
components:
  securitySchemes:
    entraAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256 v2 access token for the API, configured tenant issuer/audience,
        required exp and valid nbf if present. Scope access_as_user and
        allowed owner oid checked after authenticity. ID/Graph tokens rejected.
  schemas:
    Message:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: Unicode code points; also reject whitespace-only text and isolated surrogates.
    ChatRequest:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Message'
          description: >
            Default server maximum 10 (configurable through MAX_MESSAGES).
            Business validator enforces alternation, odd count and
            first/last user; a coherent window normally has at most 9 items.
    ChatResponse:
      type: object
      additionalProperties: false
      required: [answer, request_id, output_limited]
      properties:
        answer:
          type: string
          minLength: 1
          pattern: '\S'
          description: Usable text; whitespace-only output is a dependency error, not success.
        request_id:
          type: string
          minLength: 1
        output_limited:
          type: boolean
          description: >
            Required server-derived signal. True exactly when accepted
            Converse text has stopReason max_tokens; false for accepted normal
            completion. UI displays a notice attached to this answer when true.
            Missing or nonboolean values invalidate success; no default fallback.
    ChatError:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unsupported_path
                - unauthenticated
                - forbidden
                - method_not_allowed
                - throttled
                - dependency_unavailable
                - internal_error
            message:
              type: string
              minLength: 1
              description: User-friendly text without tokens, claims, payload, configuration or stack trace.
        request_id:
          type: string
          minLength: 1
x-cors:
  owner: Function URL configuration only
  allowOrigins: ['http://localhost:8000']
  allowMethods: [POST, OPTIONS]
  allowHeaders: [Authorization, Content-Type]
  allowCredentials: false
  description: Other browser origins are not allowed; this is not an authentication control.
x-response-headers:
  handler:
    Content-Type: application/json; charset=utf-8
    Cache-Control: no-store
  description: Handler must not emit CORS headers or sensitive diagnostic headers.
x-error-precedence:
  description: >
    Method/path and bounded transport checks precede credential validation;
    authenticity precedes scope/owner, which precede message validation.
    Inputs with multiple faults need not receive an auth error first.
    Every rejection precedes graph.invoke and Converse.
