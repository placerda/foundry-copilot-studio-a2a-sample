openapi: 3.1.0
info:
  title: Supplier-Buyer local chat API
  version: 2.0.0
  description: >
    Loopback-only Python HTTP backend for the authenticated Azure gateway.
    Entra authenticity, delegated scope and allowed user are verified before
    parsing chat content or invoking the configured native A2A requester.
servers:
  - url: http://localhost:8000
paths:
  /api/chat:
    post:
      operationId: sendChatMessage
      security:
        - entraAccessToken: []
      requestBody:
        required: true
        description: >
          At most 32768 UTF-8 bytes with no compression. Messages alternate
          user/assistant, start and end with user, and contain nonblank text.
          Only the current user question is forwarded downstream.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: A validated attributed answer or explicit no-match, without automatic continuation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          $ref: '#/components/responses/ChatError'
          description: Invalid transport, JSON, message sequence or options.
        '401':
          $ref: '#/components/responses/ChatError'
          description: Missing or invalid Entra bearer access token.
        '403':
          $ref: '#/components/responses/ChatError'
          description: Invalid Host/Origin or authenticated caller without required admission.
        '409':
          $ref: '#/components/responses/ChatError'
          description: The selected identity mode is known but not enabled.
        '429':
          $ref: '#/components/responses/ChatError'
          description: Bounded local capacity or downstream throttling, without retries.
        '500':
          $ref: '#/components/responses/ChatError'
          description: Sanitized internal error.
        '502':
          $ref: '#/components/responses/ChatError'
          description: Protected credential or downstream service unavailable or invalid response.
      x-unsupported-methods:
        options: 405
        get: 404
  /api/capabilities:
    get:
      operationId: getIdentityCapabilities
      security: []
      responses:
        '200':
          description: >
            Shared delegated is the default enabled mode. Initiating-user
            delegation and service-to-service remain disabled with reasons.
components:
  responses:
    ChatError:
      description: Rejected request or sanitized service failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatError'
  securitySchemes:
    entraAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 v2 token with exact tenant, API audience, access_as_user scope and allowed user OID.
  schemas:
    Message:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
    ChatRequest:
      type: object
      additionalProperties: false
      required: [messages, contoso_options]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Message'
        contoso_options:
          type: object
          additionalProperties: false
          required: [integration, studio_variant]
          properties:
            integration:
              const: a2a
            studio_variant:
              const: copilot-harness
        identity_mode:
          type: string
          default: shared-delegated
          enum: [shared-delegated, user-delegation, service-to-service]
    ChatResponse:
      type: object
      additionalProperties: false
      required: [answer, request_id, output_limited, contoso, identity]
      properties:
        answer:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        output_limited:
          type: boolean
          description: Indicates output capped to the client's history text limit.
        contoso:
          type: object
          additionalProperties: false
          required: [status, provider_id, studio_variant, sources, citations, execution_path]
          properties:
            status:
              enum: [answered, insufficient-evidence, no-matching-capability]
            provider_id:
              type: [string, 'null']
            studio_variant:
              enum: [copilot-harness, 'standard', null]
            sources:
              type: array
              maxItems: 32
              items:
                type: object
            citations:
              type: array
              maxItems: 64
              items:
                type: object
            execution_path:
              type: array
              minItems: 1
              maxItems: 32
              items:
                type: string
        identity:
          type: object
          additionalProperties: false
          required: [mode, application_caller, studio_caller]
          properties:
            mode:
              const: shared-delegated
            application_caller:
              type: object
              required: [tenant_id, object_id]
              properties:
                tenant_id:
                  type: string
                object_id:
                  type: string
            studio_caller:
              type: object
              additionalProperties: false
              required: [kind, verified]
              properties:
                kind:
                  const: fixed-shared-user
                verified:
                  const: false
    ChatError:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
              minLength: 1
        request_id:
          type: string
          minLength: 1
x-response-headers:
  Content-Type: application/json
  Cache-Control: no-store
  X-Request-ID: Matches the JSON request_id for chat responses.
x-browser-boundary: >
  Use the exact localhost origin and normal Microsoft sign-in. No cross-origin
  API, browser token forwarding, dynamic endpoint or fallback model is provided.
